<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudy-Site | Chat Seguro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0b0e11;
            --sidebar: #15191c;
            --chat-bg: #1e2329;
            --accent: #00c896; /* Verde Neon para contraste */
            --accent-hover: #00a57c;
            --text-p: #ffffff;
            --text-s: #949ba4;
            --msg-in: #2b2d31;
            --msg-out: #004d3b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; }

        body { background: var(--bg-main); color: var(--text-p); height: 100vh; display: flex; overflow: hidden; }

        /* --- SIDEBAR --- */
        .sidebar { width: 320px; background: var(--sidebar); display: flex; flex-direction: column; border-right: 1px solid #2d3238; transition: 0.3s; }

        .profile-section { padding: 20px; background: rgba(0,0,0,0.2); border-bottom: 1px solid #2d3238; }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 45px; height: 45px; border-radius: 12px; border: 2px solid var(--accent); object-fit: cover; }
        .user-id { font-size: 0.8rem; color: var(--accent); font-weight: bold; }

        .search-container { padding: 15px; }
        .search-container input { width: 100%; padding: 10px; border-radius: 8px; border: none; background: #2b2d31; color: white; outline: none; }

        .group-list { flex: 1; overflow-y: auto; }
        .group-item { padding: 15px; display: flex; gap: 12px; cursor: pointer; transition: 0.2s; border-left: 4px solid transparent; }
        .group-item:hover { background: #2b2d31; }
        .group-item.active { background: #2b2d31; border-left-color: var(--accent); }
        .group-icon { width: 40px; height: 40px; background: #3a4047; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: bold; }

        /* --- CHAT AREA --- */
        .main-chat { flex: 1; display: flex; flex-direction: column; background: var(--chat-bg); }

        .chat-header { padding: 15px 25px; background: var(--sidebar); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 10; }

        .messages-view { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }

        /* Animação de Entrada de Mensagem */
        .message { max-width: 70%; display: flex; flex-direction: column; gap: 4px; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .message.sent { align-self: flex-end; }
        .message.received { align-self: flex-start; }

        .msg-bubble { padding: 12px 16px; border-radius: 15px; font-size: 0.95rem; position: relative; line-height: 1.4; }
        .sent .msg-bubble { background: var(--msg-out); border-bottom-right-radius: 2px; }
        .received .msg-bubble { background: var(--msg-in); border-bottom-left-radius: 2px; }

        .msg-meta { font-size: 0.7rem; color: var(--text-s); margin-top: 2px; align-self: flex-end; }

        /* Filtro de IA Mockup */
        .ia-warning { background: #ff4757 !important; color: white !important; font-weight: bold; }

        /* --- INPUT AREA --- */
        .chat-input-bar { padding: 20px; background: var(--sidebar); display: flex; align-items: center; gap: 15px; }
        
        .input-controls { flex: 1; display: flex; background: #2b2d31; border-radius: 25px; padding: 5px 15px; align-items: center; }
        .input-controls input { flex: 1; border: none; background: transparent; color: white; padding: 10px; outline: none; }

        .action-btn { background: none; border: none; color: var(--text-s); cursor: pointer; font-size: 1.2rem; transition: 0.2s; }
        .action-btn:hover { color: var(--accent); }
        .send-btn { background: var(--accent); color: white; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; }
        .send-btn:hover { background: var(--accent-hover); transform: scale(1.05); }

        /* Áudio Player Estilizado */
        .audio-player { display: flex; align-items: center; gap: 10px; min-width: 200px; }
        .audio-wave { flex: 1; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; overflow: hidden; }
        .audio-progress { width: 40%; height: 100%; background: var(--accent); }

        /* Scrollbar Personalizado */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #2d3238; border-radius: 10px; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="profile-section">
            <div class="user-info">
                <img src="https://i.pravatar.cc/150?u=id22" class="avatar" alt="User">
                <div>
                    <h4 id="user-display-name">Veneza</h4>
                    <span class="user-id">ID: @22_dev</span>
                </div>
            </div>
        </div>

        <div class="search-container">
            <input type="search" placeholder="Buscar no mundo aberto...">
        </div>

        <nav class="group-list">
            <div class="group-item active">
                <div class="group-icon" style="color: #ff9f43">HS</div>
                <div class="group-info">
                    <h4>História & Geografia</h4>
                    <p style="font-size: 0.75rem; color: var(--accent)">● 14 ativos</p>
                </div>
            </div>
            <div class="group-item">
                <div class="group-icon" style="color: #54a0ff">DV</div>
                <div class="group-info">
                    <h4>Dev Helpers</h4>
                    <p style="font-size: 0.75rem; color: var(--text-s)">5 ativos</p>
                </div>
            </div>
        </nav>
    </aside>

    <main class="main-chat">
        <header class="chat-header">
            <div>
                <h3># História & Geografia</h3>
                <small style="color: var(--text-s)">Foco: Pré-Colonial e Território</small>
            </div>
            <div class="header-actions">
                <i class="fas fa-shield-virus action-btn" title="IA de Segurança Ativa"></i>
                <i class="fas fa-search action-btn" style="margin-left: 15px;"></i>
            </div>
        </header>

        <section class="messages-view" id="chatBox">
            <div class="message received">
                <div class="msg-bubble">
                    O estudo sobre o período pré-colonial está no bot?
                </div>
                <span class="msg-meta">10:45 AM</span>
            </div>

            <div class="message received">
                <div class="msg-bubble">
                    <div class="audio-player">
                        <i class="fas fa-play"></i>
                        <div class="audio-wave"><div class="audio-progress"></div></div>
                        <small>0:14</small>
                    </div>
                </div>
                <span class="msg-meta">10:46 AM</span>
            </div>
        </section>

        <footer class="chat-input-bar">
            <button class="action-btn" onclick="triggerFile()"><i class="fas fa-image"></i></button>
            <input type="file" id="fileInput" hidden onchange="handleFile(event)">
            
            <div class="input-controls">
                <input type="text" id="mainInput" placeholder="Escreva algo seguro..." onkeypress="checkEnter(event)">
                <button class="action-btn"><i class="fas fa-microphone"></i></button>
            </div>

            <button class="send-btn" onclick="sendMessage()">
                <i class="fas fa-paper-plane"></i>
            </button>
        </footer>
    </main>

    <script>
        const chatBox = document.getElementById('chatBox');
        const mainInput = document.getElementById('mainInput');

        // Função de Envio
        function sendMessage() {
            const text = mainInput.value.trim();
            if(!text) return;

            // Simulação de Filtro de IA para Palavras Proibidas
            if(text.toLowerCase().includes("spam") || text.toLowerCase().includes("offense")) {
                alert("IA Security: Conteúdo bloqueado por violar as diretrizes.");
                mainInput.value = "";
                return;
            }

            renderMessage(text, 'sent');
            mainInput.value = "";
            
            // Auto-scroll
            chatBox.scrollTop = chatBox.scrollHeight;

            // Simulação de Resposta Bot
            setTimeout(() => {
                renderMessage("Mensagem recebida com segurança! 🛡️", 'received');
            }, 1000);
        }

        function renderMessage(content, type) {
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type}`;
            msgDiv.innerHTML = `
                <div class="msg-bubble">${content}</div>
                <span class="msg-meta">${time}</span>
            `;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function checkEnter(e) {
            if(e.key === 'Enter') sendMessage();
        }

        function triggerFile() {
            document.getElementById('fileInput').click();
        }

        // Mock de Filtro de Imagem com IA
        function handleFile(event) {
            const file = event.target.files[0];
            if(file) {
                alert("Escaneando arquivo com IA de Segurança...");
                setTimeout(() => {
                    renderMessage(`🖼️ Arquivo enviado: ${file.name} (Verificado)`, 'sent');
                }, 1500);
            }
        }
    </script>
</body>
</html>
